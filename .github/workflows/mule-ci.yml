name: Mule - test and package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'pom.xml'
      - '.github/workflows/mule-ci.yml'
  push:
    branches: [main, master]
    paths:
      - 'apps/**'
      - 'pom.xml'
      - '.github/workflows/mule-ci.yml'

permissions:
  contents: read

concurrency:
  group: mule-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run MUnit and package all four Mule applications
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Record the source revision
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p delivery
          printf '%s\n' "$SOURCE_SHA" > delivery/source-commit.txt
          find apps -path '*/target/*-mule-application.jar' -type f -exec cp {} delivery/ \;
          test "$(find delivery -name '*-mule-application.jar' | wc -l)" -eq 4
          (cd delivery && sha256sum *.jar > SHA256SUMS)
      - name: Save tested deployment packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mule-packages-${{ github.sha }}
          path: delivery/
          if-no-files-found: error
          retention-days: 1
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: munit-reports-${{ github.sha }}
          path: |
            apps/*/target/munit-reports/
            apps/*/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 1
